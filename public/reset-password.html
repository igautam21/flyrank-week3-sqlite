
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>Reset Your Password</h2>

    <div id="request-section">
        <p>Enter your email to receive a password reset link.</p>
        <input type="email" id="email" placeholder="Your email">
        <button id="send-link">Send Reset Link</button>
    </div>

    <div id="update-section" style="display:none;">
        <p>Enter your new password.</p>
        <input type="password" id="password" placeholder="New password">
        <button id="update-password">Update Password</button>
    </div>

    <p id="message"></p>

    <script>
        const SUPABASE_URL = "https://cfioesiafpvrwjjlykem.supabase.co";
        const SUPABASE_KEY = "sb_publishable_FSfBj8v2t_YsBsgKnaTV9Q_b6vhoYbR";

        const client = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const message = document.getElementById("message");

        async function initializePage() {
            const { data, error } =
                await client.auth.getSession();

            if (error) {
                message.textContent = error.message;
                return;
            }

            if (data.session) {
                document.getElementById("request-section").style.display = "none";
                document.getElementById("update-section").style.display = "block";
            }
        }

        document.getElementById("send-link").addEventListener("click", async () => {
            const email = document.getElementById("email").value;

            if (!email) {
                message.textContent = "Please enter your email.";
                return;
            }

            const { error } = await client.auth.resetPasswordForEmail(email, {
                redirectTo: "http://localhost:3000/reset-password"
            });

            message.textContent = error
                ? error.message
                : "Reset email sent! Check your inbox.";
        });

        document.getElementById("update-password").addEventListener("click", async () => {
            const password = document.getElementById("password").value;

            if (password.length < 6) {
                message.textContent = "Password must be at least 6 characters.";
                return;
            }

            const { error } = await client.auth.updateUser({
                password: password
            });

            if (error) {
                message.textContent = error.message;
                return;
            }

            message.textContent = "Password updated successfully! You can now log in.";
        });

        initializePage();
    </script>
</body>
</html>
